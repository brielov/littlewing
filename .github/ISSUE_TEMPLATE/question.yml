name: Question
description: How to do something with littlewing
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        The language guide (LANGUAGE.md), the host API (HOST_API.md) and the playground's Learn and Functions pages answer most questions about how a formula reads and what a function takes.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you are building
      description: The kind of formulas, and who writes them
    validations:
      required: false
