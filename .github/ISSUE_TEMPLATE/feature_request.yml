name: Feature request
description: A function, an option, or a change to the language
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Two things help it along:
        - **The formulas behind it.** What your users are trying to write, and what they have to write today.
        - **Where it belongs.** Many needs are met by a host's own functions and types, through `define` and `defineType`, with no change to the language. A stored formula keeps its meaning across 3.x, so the syntax only grows in ways that cannot change what a formula already means.

  - type: dropdown
    id: kind
    attributes:
      label: What it is
      options:
        - A function, for littlewing/std or littlewing/temporal
        - Something in the host API
        - A change to the language
        - Something in the playground or docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you or your users are trying to do, with the formulas you would like to write
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What it takes today
      description: How you do it now, if you can, and what is wrong with that
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would read in a formula or in code, and what it would give
    validations:
      required: false
