name: Bug report
description: A formula that gives the wrong result, a wrong error, or none at all, or the API misbehaving
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A formula and what you expected are usually all it takes to find the cause.
        A playground link holds the formula and its inputs: write it at https://littlewing.vercel.app and copy the address.
        For a security problem, such as a formula that escapes its budget or reaches the host, do not open an issue: see SECURITY.md.

  - type: textarea
    id: formula
    attributes:
      label: The formula
      description: The smallest source that shows the problem, or a playground link
      placeholder: |
        price = 100
        price * 1.21
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The value or error you expected, and why, with a section of the spec or guide if one says so
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The value, the diagnostics with their codes, or the error and its stack
    validations:
      required: true

  - type: textarea
    id: host
    attributes:
      label: How you run it
      description: The calls and options, and any functions or types you define with `define` and `defineType`
      placeholder: |
        const result = compile(source, { functions: { ...std } });
        evaluate(result.program, { variables: { price: 100 }, numbers: 'decimal' });
      render: typescript
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: littlewing version
      placeholder: 3.0.0
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node, Bun, Deno or a browser, with its version
      placeholder: Node 22.11
    validations:
      required: true
